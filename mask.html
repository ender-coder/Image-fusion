<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影像遮罩拆分合成 - Mask Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #00adb5; --bg: #121212; --card: #1e1e1e; }
        body { background: var(--bg); color: #eee; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 1000px; }
        .nav-back { width: 100%; margin-bottom: 15px; }
        .nav-back a { color: var(--primary); text-decoration: none; font-size: 0.9rem; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #333; border-radius: 8px; cursor: pointer; border: none; color: white; transition: 0.3s; flex: 1; }
        .tab.active { background: var(--primary); }
        .section { background: var(--card); padding: 25px; border-radius: 12px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .section.active { display: block; }
        
        /* 繪圖控制區佈局修正 */
        .paint-controls { display: flex; align-items: center; gap: 15px; margin: 15px 0; background: #252525; padding: 15px; border-radius: 8px; flex-wrap: wrap; }
        .ctrl-item { display: flex; align-items: center; gap: 8px; }
        
        .canvas-wrapper { position: relative; margin-top: 20px; background: #000; overflow: auto; max-height: 70vh; border-radius: 8px; border: 2px solid #333; }
        canvas { display: block; }
        #maskCanvas { position: absolute; top: 0; left: 0; cursor: none; opacity: 0.7; } 
        #resCanvas { max-width: 100%; border-radius: 8px; cursor: pointer; }

        #brush-cursor {
            position: fixed;
            pointer-events: none;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            background: rgba(0, 173, 181, 0.4);
        }

        .option-group { display: flex; gap: 20px; background: #2a2a2a; padding: 10px 15px; border-radius: 6px; align-items: center; }
        input[type="text"], input[type="file"], input[type="range"], select { background: #252525; color: white; border: 1px solid #333; padding: 8px; border-radius: 4px; vertical-align: middle; }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; flex: 2; }
        .btn-sub { background: #393e46; color: white; }
        .btn-danger { background: #cf4545; color: white; }
        #status { margin-top: 15px; color: var(--primary); font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div id="brush-cursor"></div> 
<div class="nav-back"><a href="index.html">⬅ 返回選單</a></div>

<div class="container">
    <div class="tab-group">
        <button class="tab active" onclick="switchTab('split')">繪製拆解 (Split)</button>
        <button class="tab" onclick="switchTab('merge')">合成還原 (Merge)</button>
    </div>

    <div id="section-split" class="section active">
        <h2>上傳影像</h2>
        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <input type="file" id="uploadImg" accept="image/*" onchange="initSplit()">
            <div class="option-group">
                <label>拆分模式：</label>
                <select id="splitLogic">
                    <option value="alpha">透明挖空拆分 (簡單疊加)</option>
                    <option value="xor">XOR 密碼拆分 (推薦)</option>
                </select>
            </div>
        </div>
        
        <div id="editorArea" style="display:none; margin-top: 20px;">
            <div class="paint-controls">
                <button class="btn-sub" onclick="setTool('brush')">🖌️ 畫筆</button>
                <button class="btn-sub" onclick="setTool('eraser')">🧽 橡皮擦</button>
                
                <div class="ctrl-item">
                    <label>筆刷顏色:</label>
                    <input type="color" id="brushColor" value="#00adb5" oninput="updateBrushColor()">
                </div>

                <div class="ctrl-item">
                    <label>筆刷大小:</label>
                    <input type="range" id="brushSize" min="5" max="150" value="40" oninput="updateCursorSize()">
                </div>

                <button class="btn-danger" onclick="clearMask()">🗑️ 全部清除</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="mainCanvas"></canvas>
                <canvas id="maskCanvas"></canvas>
            </div>
            <button class="btn-main" style="width:100%; margin-top:20px; font-size: 1.1rem;" onclick="processMaskSplit()">生成加密並下載 ZIP</button>
        </div>
    </div>

    <div id="section-merge" class="section">
        <h2>合成圖像</h2>
        <div class="paint-controls">
            <div style="flex:1">
                <label>Share 1</label>
                <input type="file" id="mFile1" accept="image/*" style="width:90%">
            </div>
            <div style="flex:1">
                <label>Share 2</label>
                <input type="file" id="mFile2" accept="image/*" style="width:90%">
            </div>
        </div>
        <button class="btn-main" style="width:100%" onclick="handleMerge()">立即合成預覽</button>
        <div style="text-align:center; margin-top: 20px;">
            <canvas id="resCanvas" onclick="downloadRes()"></canvas>
            <p id="dl-tip" style="display:none; color:#888;">點擊圖片即可下載 PNG</p>
        </div>
    </div>
    
    <div id="status"></div>
</div>

<script>
    let isDrawing = false;
    let currentFileName = "Image";
    let activeTool = 'brush';
    const mCvs = document.getElementById('mainCanvas');
    const mCtx = mCvs.getContext('2d');
    const maskCvs = document.getElementById('maskCanvas');
    const maskCtx = maskCvs.getContext('2d');
    const brushCursor = document.getElementById('brush-cursor');
    
    function switchTab(tab) {
        // 1. 切換分頁樣式
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        if (event && event.target.tagName === 'BUTTON') event.target.classList.add('active');
        document.getElementById(`section-${tab}`).classList.add('active');
        
        // 2. 清除狀態與提示
        document.getElementById('status').innerText = ""; // 清除 "✅ 下載完成"
        document.getElementById('dl-tip').style.display = "none"; // 隱藏下載提示文字
        
        // 3. 清除合成結果畫布 (避免切換回來還看到舊圖)
        const resCvs = document.getElementById('resCanvas');
        const resCtx = resCvs.getContext('2d');
        resCtx.clearRect(0, 0, resCvs.width, resCvs.height);
        
        // 4. 確保筆刷游標在切換時消失
        brushCursor.style.display = "none";
    }
    
    function getBestContrastColor(ctx, width, height) {
        const data = ctx.getImageData(0, 0, width, height).data;
        let rSum = 0, gSum = 0, bSum = 0;
        const step = 4 * 10;
        let count = 0;
        for (let i = 0; i < data.length; i += step) {
            rSum += data[i]; gSum += data[i+1]; bSum += data[i+2];
            count++;
        }
        const brightness = (0.299 * (rSum/count) + 0.587 * (gSum/count) + 0.114 * (bSum/count));
        return (brightness > 128) ? "#ff00ff" : "#00ff00";
    }

    async function initSplit() {
        const file = document.getElementById('uploadImg').files[0];
        if (!file) return;
        currentFileName = file.name.split('.')[0];
        const img = await loadImage(URL.createObjectURL(file));
        mCvs.width = maskCvs.width = img.width;
        mCvs.height = maskCvs.height = img.height;
        mCtx.drawImage(img, 0, 0);
        
        const bestColor = getBestContrastColor(mCtx, img.width, img.height);
        document.getElementById('brushColor').value = bestColor;
        
        clearMask();
        document.getElementById('editorArea').style.display = 'block';
        
        maskCvs.onmousedown = (e) => { isDrawing = true; draw(e); };
        window.onmouseup = () => isDrawing = false;
        maskCvs.onmousemove = (e) => { draw(e); moveCursor(e); };
        maskCvs.onmouseenter = () => { if(activeTool!=='none') brushCursor.style.display = "block"; };
        maskCvs.onmouseleave = () => brushCursor.style.display = "none";
        updateCursorSize();
        updateBrushColor();
    }

    function updateCursorSize() {
        const size = document.getElementById('brushSize').value;
        const rect = maskCvs.getBoundingClientRect();
        const displaySize = size * (rect.width / maskCvs.width);
        brushCursor.style.width = (displaySize * 2) + "px";
        brushCursor.style.height = (displaySize * 2) + "px";
    }

    function updateBrushColor() {
        const color = document.getElementById('brushColor').value;
        maskCtx.fillStyle = color;
        if (activeTool === 'brush') {
            const r = parseInt(color.slice(1,3), 16);
            const g = parseInt(color.slice(3,5), 16);
            const b = parseInt(color.slice(5,7), 16);
            brushCursor.style.background = `rgba(${r}, ${g}, ${b}, 0.5)`;
        }
    }

    function moveCursor(e) {
        brushCursor.style.left = e.clientX + "px";
        brushCursor.style.top = e.clientY + "px";
    }

    function setTool(tool) {
        activeTool = tool;
        if (tool === 'eraser') {
            maskCtx.globalCompositeOperation = 'destination-out';
            brushCursor.style.background = "rgba(255, 255, 255, 0.2)";
            brushCursor.style.border = "2px dashed #fff";
        } else {
            maskCtx.globalCompositeOperation = 'source-over';
            brushCursor.style.border = "2px solid #fff";
            updateBrushColor();
        }
    }

    function clearMask() {
        maskCtx.clearRect(0, 0, maskCvs.width, maskCvs.height);
        updateBrushColor();
    }

    function draw(e) {
        if (!isDrawing) return;
        const rect = maskCvs.getBoundingClientRect();
        const scaleX = maskCvs.width / rect.width;
        const scaleY = maskCvs.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        const size = document.getElementById('brushSize').value;
        maskCtx.beginPath();
        maskCtx.arc(x, y, size, 0, Math.PI * 2);
        maskCtx.fill();
    }

    async function processMaskSplit() {
        const status = document.getElementById('status');
        const logic = document.getElementById('splitLogic').value;
        status.innerText = "⏳ 處理中...";
        const w = mCvs.width, h = mCvs.height;
        const imgData = mCtx.getImageData(0, 0, w, h);
        const maskData = maskCtx.getImageData(0, 0, w, h);
        const s1 = new ImageData(w, h);
        const s2 = new ImageData(w, h);
        const rnd = new Uint8Array(imgData.data.length);
        for (let i = 0; i < rnd.length; i += 65536) {
            const size = Math.min(65536, rnd.length - i);
            crypto.getRandomValues(rnd.subarray(i, i + size));
        }

        for (let i = 0; i < imgData.data.length; i += 4) {
            const isMasked = maskData.data[i + 3] > 0;
            if (logic === 'xor') {
                if (isMasked) {
                    for (let k = 0; k < 3; k++) {
                        s1.data[i+k] = rnd[i+k];
                        s2.data[i+k] = imgData.data[i+k] ^ rnd[i+k];
                    }
                } else {
                    for (let k = 0; k < 3; k++) {
                        s1.data[i+k] = imgData.data[i+k];
                        s2.data[i+k] = 0;
                    }
                }
                s1.data[i+3] = 255; s2.data[i+3] = 255;
            } else {
                if (isMasked) {
                    s2.data.set(imgData.data.subarray(i, i+4), i);
                    s1.data[i+3] = 0; 
                } else {
                    s1.data.set(imgData.data.subarray(i, i+4), i);
                    s2.data[i+3] = 0;
                }
            }
        }

        const zip = new JSZip();
        const tCvs = document.createElement('canvas'); tCvs.width = w; tCvs.height = h;
        const tCtx = tCvs.getContext('2d');
        tCtx.putImageData(s1, 0, 0);
        zip.file(`${currentFileName}_S1.webp`, await new Promise(r => tCvs.toBlob(r, 'image/webp', 1)));
        tCtx.putImageData(s2, 0, 0);
        zip.file(`${currentFileName}_S2.webp`, await new Promise(r => tCvs.toBlob(r, 'image/webp', 1)));
        const blob = await zip.generateAsync({type:"blob", compression:"STORE"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${currentFileName}_Masked.zip`;
        a.click();
        status.innerText = "✅ 下載完成";
    }

    async function handleMerge() {
        const f1 = document.getElementById('mFile1').files[0];
        const f2 = document.getElementById('mFile2').files[0];
        if (!f1 || !f2) return alert("請選取檔案");
        const [i1, i2] = await Promise.all([loadImage(URL.createObjectURL(f1)), loadImage(URL.createObjectURL(f2))]);
        const resCvs = document.getElementById('resCanvas');
        resCvs.width = i1.width; resCvs.height = i1.height;
        const ctx = resCvs.getContext('2d');
        ctx.drawImage(i1, 0, 0);
        const d1 = ctx.getImageData(0, 0, i1.width, i1.height);
        ctx.clearRect(0,0,i1.width,i1.height);
        ctx.drawImage(i2, 0, 0);
        const d2 = ctx.getImageData(0, 0, i1.width, i1.height);
        const resData = ctx.createImageData(i1.width, i1.height);
        for (let i = 0; i < d1.data.length; i += 4) {
            resData.data[i] = d1.data[i] ^ d2.data[i];
            resData.data[i+1] = d1.data[i+1] ^ d2.data[i+1];
            resData.data[i+2] = d1.data[i+2] ^ d2.data[i+2];
            resData.data[i+3] = 255;
        }
        ctx.putImageData(resData, 0, 0);
        document.getElementById('dl-tip').style.display = "block";
    }

    function downloadRes() {
        const link = document.createElement('a');
        link.download = "Recovered.png";
        link.href = document.getElementById('resCanvas').toDataURL();
        link.click();
    }

    function loadImage(url) {
        return new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = rej;
            i.src = url;
        });
    }
</script>
</body>
</html>
